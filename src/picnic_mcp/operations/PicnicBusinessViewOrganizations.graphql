# route: picnic-gateway
query PicnicBusinessViewOrganizations {
  picnicBusinessViewOrganizations {
    __typename
    id
    organizationName
    createdAt
    updatedAt
    hubCount
    stipendCount
    hubs {
      ...EaterOrganizationHubFields
    }
  }
}

fragment EaterOrganizationHubFields on EaterOrganizationHub {
  __typename
  id
  name
  shortCode
  floor
  buildingName
  address {
    ...CanonicalAddressFields
  }
  timezone
}

fragment CanonicalAddressFields on CanonicalAddress {
  countryIso
  addressLocalized {
    addressType
    addressLines
    addressLocality
    addressPostalCode
    addressRegion
    streetNumber
    placeName
  }
  coordinate {
    latitude
    longitude
  }
  addressComponent {
    adminLevel1
    adminLevel2
    adminLevel3
    adminLevel4
    adminLevel5
    adminLocality1
    adminLocality2
    adminLocality3
    adminLocality4
    adminLocality5
    adminLocality6
    neighborhood
    buildingName
    buildingNumber
    secondaryAddressUnit
    country
    streetNumber
  }
}
