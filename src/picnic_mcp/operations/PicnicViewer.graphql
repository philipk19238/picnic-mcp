# route: picnic-gateway
query PicnicViewer($hubId: String, $includeGiveReferralCouponCode: Boolean = true) {
  picnicEater {
    id
    sendPicnicOffersUpdates
    sendPicnicOffersUpdatesText
    sendOrderStatusEmailNotifications
    sendOrderStatusSmsNotifications
    giveReferralCouponCodeByHub(hubId: $hubId) @include(if: $includeGiveReferralCouponCode)
    batchOrderGiveReferralCouponCodeByHub(hubId: $hubId) @include(if: $includeGiveReferralCouponCode)
    hubId
    acceptedTermsAndConditions
    showPricesIncludingTax
    showPricesIncludingTaxDefault
    commPreferences {
      ...CommPreferencesFields
    }
    dietaryPreferences
    allergens
    organizations {
      ...RestrictedEaterOrganizationFields
      deliveryHubs {
        ...DeliveryHubsFields
      }
    }
  }
}

fragment CommPreferencesFields on PicnicCommPreference {
  category
  channel
  enabled
}

fragment RestrictedEaterOrganizationFields on RestrictedEaterOrganization {
  id
  organizationName
}

fragment DeliveryHubsFields on DeliveryHub {
  id
  name
  category
  eaterPickupInstructions
  shortCode
  isHubShared
  isHidden
  isVirtual
  floor
  organizationName
  buildingName
  timezone
  address {
    ...CanonicalAddressFields
  }
  individualRoutes(selectionMode: ONE_PER_DELIVERY_WINDOW) {
    ...BasicIndividualDeliveryRoute
  }
}

fragment CanonicalAddressFields on CanonicalAddress {
  countryIso
  addressLocalized {
    addressType
    addressLines
    addressLocality
    addressPostalCode
    addressRegion
    streetNumber
    placeName
  }
  coordinate {
    latitude
    longitude
  }
  addressComponent {
    adminLevel1
    adminLevel2
    adminLevel3
    adminLevel4
    adminLevel5
    adminLocality1
    adminLocality2
    adminLocality3
    adminLocality4
    adminLocality5
    adminLocality6
    neighborhood
    buildingName
    buildingNumber
    secondaryAddressUnit
    country
    streetNumber
  }
}

fragment BasicIndividualDeliveryRoute on IndividualDeliveryRoute {
  routeId
  hub {
    id
  }
  restrictedFacility {
    id
    timezone
    currencyCode
  }
  windowDisplayName
  deliveryWindowStart
  deliveryWindowEnd
  maxOrderingLeadTime
  minOrderingLeadTime
}
