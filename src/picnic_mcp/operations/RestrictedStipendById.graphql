# route: picnic-gateway
query RestrictedStipendById($stipendId: String!, $allowlistEntryId: ID! = "", $includeAllowlistEntryAccess: Boolean! = false) {
  restrictedStipendById(input: { stipendId: $stipendId }) {
    organization {
      organizationName
    }
    deliveryHubs {
      ...DeliveryHubsFields
    }
    allowlistEntryAccess(allowlistEntryId: $allowlistEntryId) @include(if: $includeAllowlistEntryAccess) {
      accessStartDate
      accessEndDate
    }
  }
}

fragment DeliveryHubsFields on DeliveryHub {
  id
  name
  category
  eaterPickupInstructions
  shortCode
  isHubShared
  isHidden
  isVirtual
  floor
  organizationName
  buildingName
  timezone
  address {
    ...CanonicalAddressFields
  }
  individualRoutes(selectionMode: ONE_PER_DELIVERY_WINDOW) {
    ...BasicIndividualDeliveryRoute
  }
}

fragment CanonicalAddressFields on CanonicalAddress {
  countryIso
  addressLocalized {
    addressType
    addressLines
    addressLocality
    addressPostalCode
    addressRegion
    streetNumber
    placeName
  }
  coordinate {
    latitude
    longitude
  }
  addressComponent {
    adminLevel1
    adminLevel2
    adminLevel3
    adminLevel4
    adminLevel5
    adminLocality1
    adminLocality2
    adminLocality3
    adminLocality4
    adminLocality5
    adminLocality6
    neighborhood
    buildingName
    buildingNumber
    secondaryAddressUnit
    country
    streetNumber
  }
}

fragment BasicIndividualDeliveryRoute on IndividualDeliveryRoute {
  routeId
  hub {
    id
  }
  restrictedFacility {
    id
    timezone
    currencyCode
  }
  windowDisplayName
  deliveryWindowStart
  deliveryWindowEnd
  maxOrderingLeadTime
  minOrderingLeadTime
}
